
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Barber Shop</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #dcecf8, #f3b6a5);
  color: #263746;
}
.chat {
  max-width: 620px;
  margin: 35px auto;
  background: #fffaf7;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 30px #34495e25;
}
header {
  background: #263746;
  color: white;
  padding: 22px;
}
header h1 { margin: 0 0 6px; font-size: 22px; }
header p { margin: 0; opacity: .8; }
#messages {
  height: 390px;
  overflow-y: auto;
  padding: 18px;
}
.message {
  max-width: 85%;
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 14px;
  line-height: 1.45;
  white-space: pre-line;
}
.bot { background: #edf1f4; }
.user {
  background: #263746;
  color: white;
  margin-left: auto;
}
form {
  display: flex;
  gap: 8px;
  padding: 14px;
  border-top: 1px solid #ddd;
}
input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #ccd2d8;
  border-radius: 10px;
  font-size: 15px;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 0 18px;
  background: #263746;
  color: white;
  cursor: pointer;
}
button:hover { opacity: .85; }
.hint {
  text-align: center;
  font-size: 12px;
  color: #65717b;
  padding: 0 12px 15px;
}
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>Assistant Barber Shop</h1>
    <p>Bienvenue ! Comment puis-je vous aider ?</p>
  </header>

  <div id="messages" aria-live="polite">
    <div class="message bot">
      Bonjour ! Je suis l'assistant virtuel de Barber Shop.
      Vous pouvez me poser vos questions sur les tarifs,
      les horaires ou les réservations.
    </div>
  </div>

  <form id="chatForm">
    <input id="question" placeholder="Écrivez votre question..." autocomplete="off" required>
    <button type="submit">Envoyer</button>
  </form>
  <div class="hint">Assistant automatique • Barber Shop</div>
</div>

<script>
const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("question");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function getAnswer(question) {
  const q = question.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

  if (/bonjour|salut|bonsoir|hello/.test(q)) {
    return "Bonjour et bienvenue chez Barber Shop ! Que souhaitez-vous savoir ?";
  }

  if (/prix|tarif|combien|coute|coût/.test(q)) {
    return "Voici nos tarifs :\n• Coupe enfant : 15 €\n• Dégradé classique : 20 €\n• Dégradé à blanc : 25 €.";
  }

  if (/enfant/.test(q)) {
    return "La coupe enfant coûte 15 € et dure 30 minutes.";
  }

  if (/blanc/.test(q)) {
    return "Le dégradé à blanc coûte 25 € et dure 30 minutes.";
  }

  if (/classique|degrade/.test(q)) {
    return "Le dégradé classique coûte 20 € et dure 30 minutes.";
  }

  if (/horaire|ouvre|ouvert|ferme|fermeture|heure|jour/.test(q)) {
    return "Les horaires prévus sont du mardi au samedi, de 9 h à 18 h. Vérifiez ces horaires auprès du salon avant votre venue.";
  }

  if (/reservation|reserver|rendez-vous|rendez vous|disponible|creneau/.test(q)) {
    return "Pour réserver, retournez sur le site Barber Shop et cliquez sur « Choisir » à côté de la coupe souhaitée. Chaque rendez-vous dure 30 minutes.";
  }

  if (/duree|longtemps|temps/.test(q)) {
    return "Chaque prestation est prévue pour un rendez-vous de 30 minutes.";
  }

  if (/adresse|localisation|situe|trouver/.test(q)) {
    return "Je n'ai pas encore l'adresse du salon. Veuillez contacter directement Barber Shop pour la connaître.";
  }

  if (/merci/.test(q)) {
    return "Avec plaisir ! À bientôt chez Barber Shop.";
  }

  return "Je ne connais pas encore la réponse à cette question. Pour obtenir une information fiable, contactez directement le salon.";
}

form.addEventListener("submit", function(event) {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, "user");
  input.value = "";

  setTimeout(function() {
    addMessage(getAnswer(question), "bot");
  }, 350);
});
</script>
</body>
</html>
